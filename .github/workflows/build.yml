name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
    - name: Checkout SSI Library
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        # No crate in this workspace declares `rust-version`, so this was a CI pin rather than a
        # real MSRV. Transitive deps in the committed lock (e.g. base64ct 1.8) no longer build on
        # 1.66, and LearnCard already builds this code with stable.
        toolchain: "stable"
        profile: minimal
        override: true
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: "true"

    - name: Fmt
      run: cargo fmt -- --check

    - name: Build
      run: cargo build --workspace

    - name: Clippy
      run: cargo clippy --workspace

    - name: Test vc-test-suite
      run: |
        cd vc-test-suite
        npm i
        cp ../vc-test/config.json .
        npm test

    - name: Test WASM compilation
      run: |
        rustup target add wasm32-unknown-unknown
        cargo check --workspace --target wasm32-unknown-unknown

    - name: Test examples
      run: |
        cargo test --examples

  test-each-feature:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout SSI Library
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: "stable"
        profile: minimal
        override: true

    - uses: taiki-e/install-action@cargo-hack

    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: "true"

    - name: Test each feature
      run: cargo hack test --each-feature --workspace --exclude ssi --exclude 'ssi-did-test' --exclude 'ssi-vc-test'  -- --test-threads=4
